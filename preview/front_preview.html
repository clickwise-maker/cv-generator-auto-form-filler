*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
.hero{position:sticky;top:0;z-index:7;height:80vh;overflow:hidden;background:#000}

.langs button,.mute{font:500 12px var(--sans);color:#fff;background:rgba(0,0,0,.38);border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:6px 12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:pointer}
.langs button[aria-pressed=true]{background:rgba(255,255,255,.88);color:#000}
.mute{position:absolute;right:12px;bottom:12px}
main{position:relative;z-index:6;background:var(--bg)}
.sec{max-width:1120px;margin:0 auto;padding:72px 22px}

.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:26px}.acts .go{margin-top:0;padding:15px 8px;white-space:nowrap;display:block;text-align:center;text-decoration:none}.cta{text-align:center}.cta h1,.cta .tagline{margin-left:auto;margin-right:auto}.cta .acts{max-width:560px;margin:26px auto 0}

.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px}
.f{background:var(--card);padding:40px 32px 34px;border-radius:0;transition:background .3s}

.start{display:grid;grid-template-columns:1fr 1.1fr;gap:56px;align-items:center}
.start h2{font:600 clamp(30px,4vw,46px)/1.1 var(--serif);margin:0 0 14px}
.start .lead{color:var(--mute);line-height:1.6;margin:0}
.card{background:var(--card);border:1px solid var(--line);padding:34px 30px;transition:box-shadow .4s,border-color .4s}
.card:hover{border-color:rgba(255,255,255,.22);box-shadow:0 0 0 1px rgba(255,255,255,.04),0 24px 60px rgba(255,255,255,.06)}
.card h2{font:600 26px var(--serif);margin:0 0 6px}.card p{color:var(--mute);font-size:14px;margin:0 0 18px}
label{display:block;font:500 11px var(--sans);letter-spacing:.18em;text-transform:uppercase;color:var(--mute);margin:18px 0 8px}label i{color:#d9a46b;font-style:normal}
input,select{width:100%;padding:12px 14px;background:#0a0a0a;color:#fff;border:1px solid var(--line);border-radius:0;font:15px var(--sans);outline:none;transition:border-color .2s}
input::placeholder{color:#5c5c5c}input:focus,select:focus{border-color:rgba(255,255,255,.5)}
select option{background:#111;color:#fff}
.ph{display:flex;align-items:stretch}.ph select{width:auto;flex:0 0 8.5em;border-right:0}
.phchip{display:inline-flex;align-items:center;padding:0 12px;background:#1a1a1a;border:1px solid var(--line);color:#fff;font-weight:600;white-space:nowrap;letter-spacing:.03em}
.ph input{flex:1;min-width:6em;border-left:0}
.go{margin-top:26px;width:100%;background:linear-gradient(180deg,#fff,#d8d8d8);color:#000;border:0;border-radius:0;padding:15px;font:600 13px var(--sans);letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:box-shadow .3s}
