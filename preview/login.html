<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><title>CV Studio — Log in</title></head><body><div class="wrap"><a class="kicker" href="/">CV Studio</a>
<form class="card" id="f"><h2>Log in</h2><p>Open your account.</p>
<label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
<label>Password</label><input id="password" type="password" autocomplete="current-password" required>
<button class="go" id="submit">Log in</button><p class="or">OR</p><button class="go alt" type="button" id="google">Continue with Google</button>
<p id="msg" role="alert"></p><div class="links"><a href="signup.html" id="toSignup">Create account</a><a href="forgot.html">Forgot password?</a></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
$('toSignup').href='signup.html'+location.search;$('google').onclick=google;
if(qs.get('reset')==='1')say('Password updated. Log in with your new password.',1);
$('f').onsubmit=async e=>{e.preventDefault();say('');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return say(error.message);location.href=next()};
</script></body></html>
