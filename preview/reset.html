<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><title>CV Studio — Choose a new password</title>  <script defer src="analytics.js"></script>
</head><body><div class="wrap"><a class="kicker" href="/">CV Studio</a>
<form class="card" id="f"><h2>New password</h2><p>Choose a new password for your account.</p>
<label>New password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
<button class="go" id="submit">Save password</button><p id="msg" role="alert"></p><div class="links"><a href="login.html">Back to log in</a></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
setTimeout(async()=>{const {data}=await sb.auth.getSession();if(!data.session)say('Open this page from the reset link in your email.')},1200);
$('f').onsubmit=async e=>{e.preventDefault();say('');const {error}=await sb.auth.updateUser({password:$('password').value});if(error)return say(error.message);await sb.auth.signOut();location.href='login.html?reset=1'};
</script></body></html>
