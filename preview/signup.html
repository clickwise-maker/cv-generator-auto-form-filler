<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="favicon.svg" type="image/svg+xml"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="auth.css"><title>CV Studio — Create account</title>  <script defer src="analytics.js"></script>
</head><body><div class="wrap"><a class="kicker" href="/">CV Studio</a>
<form class="card" id="f"><h2>Create account</h2><p>One profile. Your CV, and every form filled for you.</p>
<label>Full name</label><input id="name" required placeholder="e.g. Asha Menon">
<label>Email</label><input id="email" type="email" autocomplete="email" required placeholder="you@example.com">
<label>Password</label><input id="password" type="password" autocomplete="new-password" minlength="8" required placeholder="At least 8 characters">
<button class="go" id="submit">Create account</button><p class="or">OR</p><button class="go alt" type="button" id="google">Continue with Google</button>
<p id="msg" role="alert"></p><div class="links"><a href="login.html" id="toLogin">Already have an account? Log in</a></div></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="auth.js"></script><script>
$('toLogin').href='login.html'+location.search;$('google').onclick=google;
$('f').onsubmit=async e=>{e.preventDefault();say('');const {data,error}=await sb.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:$('name').value.trim()},emailRedirectTo:base+next()}});if(error)return say(error.message);if(data.session)location.href=next();else say('Check your email to confirm your account, then log in.',1)};
</script></body></html>
