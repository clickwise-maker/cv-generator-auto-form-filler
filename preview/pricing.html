<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CV Studio — Pricing</title>
<meta name="description" content="CV Studio packages and pricing.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
<script defer src="analytics.js"></script>
<script src="pricing-config.js"></script>
<style>
.wrap{justify-content:flex-start}
h1{font:600 clamp(28px,5vw,42px) var(--serif);margin:0 0 10px;text-align:center}
.lead{color:var(--mute);text-align:center;max-width:560px;margin:0 0 22px;font-size:15px;line-height:1.6}
.ctl{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:center;margin-bottom:26px}
.seg{display:flex;border:1px solid var(--line)}
.seg button{background:transparent;color:var(--mute);border:0;padding:10px 18px;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.seg button[aria-pressed="true"]{background:#fff;color:#000}
select{padding:10px 12px;background:#0a0a0a;color:#fff;border:1px solid var(--line);border-radius:0;font:14px var(--sans)}
.phchip{display:inline-flex;align-items:center;padding:0 12px;height:40px;background:#1a1a1a;border:1px solid var(--line);font-weight:600}
.pk{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;width:100%;max-width:1180px;margin-bottom:22px}
.p{background:var(--card);border:1px solid var(--line);padding:24px 20px;display:flex;flex-direction:column;transition:border-color .2s,opacity .2s;opacity:.6}
.p.on{border-color:#fff;box-shadow:0 0 0 1px #fff inset;opacity:1}
.tag{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.p h3{font:600 20px var(--serif);margin:8px 0 14px}
.price{font:600 30px var(--serif);margin:4px 0 0}.per{color:var(--mute);font-size:13px;margin-bottom:10px}
.or{font:600 10px var(--sans);letter-spacing:.24em;color:var(--mute);margin:6px 0}
.p ul{margin:6px 0 16px;padding-left:18px;color:#cfcfcf;font-size:13.5px;line-height:1.6;flex:1}
.rb{display:none;font:600 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;background:#fff;color:#000;padding:3px 8px;align-self:flex-start;margin-bottom:8px}
.p.on .rb{display:inline-block}
.p .go{text-align:center;text-decoration:none;margin-top:auto}
.note{color:var(--mute);font-size:13px;text-align:center;margin:0 0 6px}
@media(max-width:1000px){.pk{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.pk{grid-template-columns:1fr}}
</style>
<link rel="canonical" href="https://cvstudio-preview.onrender.com/pricing.html">
<meta property="og:type" content="website"><meta property="og:title" content="CV Studio — Pricing"><meta property="og:url" content="https://cvstudio-preview.onrender.com/pricing.html"><meta property="og:description" content="CV Studio: free CV builder (no login), plain and designed templates, PDF/DOCX download, free watermarked download and an Auto Form Filler for job applications. Single Use ₹20/$1, Career Starter ₹1,000/year, Global Pro $29/year.">
</head>
<body>
<main class="wrap">
<a class="kicker" href="front_preview.html">CV Studio</a>
<h1>Pricing</h1>
<p class="lead">Simple packages for India and other countries. Choose your region to see the prices that apply to you.</p>
<div class="ctl">
 <div class="seg" role="group" aria-label="Region"><button type="button" id="rIn" aria-pressed="true">India</button><button type="button" id="rIntl" aria-pressed="false">Other countries</button></div>
 <select id="phCountry" aria-label="Country phone prefix"></select><span class="phchip" id="phChip">+91</span>
</div>
<div class="pk" id="pk"></div>
<p class="note">Payments open soon — no payment is taken on this page.</p>
<p style="text-align:center;margin:0 0 24px"><a href="refund-policy.html" style="color:#666;font-size:12px">Refund Policy</a> · <a href="services.html" style="color:#666;font-size:12px">Services &amp; Plans</a></p>
</main>
<script>
const P=window.PRICING,R=P.inr,D=P.usd,f=n=>n.toLocaleString('en-IN');
const DIAL={'india':'+91','japan':'+81','uae':'+971','dubai':'+971','abu dhabi':'+971','qatar':'+974','usa':'+1','canada':'+1','china':'+86','hong kong':'+852','uk':'+44','saudi arabia':'+966','oman':'+968','kuwait':'+965','bahrain':'+973','singapore':'+65','korea':'+82','germany':'+49','france':'+33','australia':'+61'};
const LABEL={'india':'India','japan':'Japan','uae':'UAE','dubai':'Dubai (UAE)','abu dhabi':'Abu Dhabi (UAE)','qatar':'Qatar','usa':'USA','canada':'Canada','china':'China','hong kong':'Hong Kong','uk':'UK','saudi arabia':'Saudi Arabia','oman':'Oman','kuwait':'Kuwait','bahrain':'Bahrain','singapore':'Singapore','korea':'Korea','germany':'Germany','france':'France','australia':'Australia'};
const $=id=>document.getElementById(id);
const M=P.merchant;
const cards=[
 {id:'cvIn',reg:'india',tag:'India',t:'CV Generator',a:[R+f(P.cvIndia.single),'single download'],b:[R+f(P.cvIndia.yearly),'per year · unlimited compiles'],li:['Pay per CV, or','one year of unlimited compiles'],url:P.studioUrl},
 {id:'afIn',reg:'india',tag:'India',t:'Auto-Compiler (Auto Form Filler)',a:[R+f(P.autoIndia.single),'single download'],b:[R+f(P.autoIndia.monthly),'per month'],li:['Fill application forms automatically','Pay per download or monthly'],url:P.studioUrl},
 {id:'intl',reg:'intl',tag:'International',t:'CV Generator & Auto-Compiler',a:[D+P.intl.single,'single download, each'],b:[D+P.intl.yearly,'per year · unlimited (CV)'],li:['CV or auto-compiler download','Yearly unlimited CV compiles'],url:P.studioUrl},
 {id:'mer',reg:'both',tag:'Merchant',t:'Merchant Plan',a:[D+M.usd,'one-time · '+M.years+' year · '+M.compiles+' compiles (International)'],b:[R+f(M.inr),M.compiles+' compiles (India)'],li:['For businesses & agencies','Building CVs for clients'],url:P.merchantUrl}];
$('pk').innerHTML=cards.map(c=>`<article class="p" id="c_${c.id}" data-reg="${c.reg}"><span class="rb">For your region</span><span class="tag">${c.tag}</span><h3>${c.t}</h3>
<div class="price" data-k="a">${c.a[0]}</div><div class="per">${c.a[1]}</div><div class="or">OR</div><div class="price" data-k="b">${c.b[0]}</div><div class="per">${c.b[1]}</div>
<ul>${c.li.map(x=>'<li>'+x+'</li>').join('')}</ul><a class="go" href="${c.url}">Get started</a></article>`).join('');
const phSel=$('phCountry');for(const k in LABEL)phSel.add(new Option(LABEL[k]+' '+DIAL[k],k));
function setRegion(r){$('rIn').setAttribute('aria-pressed',r==='india');$('rIntl').setAttribute('aria-pressed',r==='intl');
 document.querySelectorAll('.p').forEach(el=>{const on=el.dataset.reg===r||el.dataset.reg==='both';el.classList.toggle('on',on);
  if(el.id==='c_mer'){el.querySelector('[data-k=a]').style.opacity=r==='intl'?1:.45;el.querySelector('[data-k=b]').style.opacity=r==='india'?1:.45}});document.body.dataset.region=r}
function phSync(){$('phChip').textContent=DIAL[phSel.value];setRegion(DIAL[phSel.value]==='+91'?'india':'intl')}
phSel.onchange=phSync;
$('rIn').onclick=()=>{phSel.value='india';phSync()};
$('rIntl').onclick=()=>{if(phSel.value==='india')phSel.value='usa';phSync()};
const q=new URLSearchParams(location.search).get('c');
phSel.value=(q&&DIAL[q.toLowerCase()])?q.toLowerCase():'india';phSync();
</script>
</body>
</html>
